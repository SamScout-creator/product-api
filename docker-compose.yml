version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  product-api:
    image: product-api:latest
    container_name: product-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Kết nối tới dịch vụ 'mongodb' ở trên
      - MONGO_URI=mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # Kiểm tra đường dẫn /health mà chúng ta đã viết ở file index.js
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s