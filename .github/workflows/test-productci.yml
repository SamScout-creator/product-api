name: CI Pipeline Test

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Tạo một database MongoDB ảo trên GitHub để chạy Test
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Cài đặt thư viện
      run: npm install

    - name: Chạy Test Script tự động
      run: npm test
      env:
        MONGO_URI: mongodb://localhost:27017/testdb