version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb_prod
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  product-api-prod:
    # Sử dụng image từ Docker Hub của bạn
    image: samscoutcreator/product-api:latest
    container_name: product-api-prod
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy